<!doctype html>
<html lang="pt-BR" class="dark bg-slate-950 text-slate-100" style="background-color: #020617; color: #f8fafc; overflow-x: hidden; width: 100%;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var activeFetch = originalFetch ? originalFetch.bind(window) : undefined;
          var fetchDescriptor = {
            configurable: true,
            enumerable: true,
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            }
          };

          try {
            Object.defineProperty(window, 'fetch', fetchDescriptor);
          } catch (e1) {}

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', fetchDescriptor);
            } catch (e2) {}
          }
        } catch (e) {
          // Ignore
        }

        // Suppress any external extension errors that try to inject into iframe
        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          var file = event.filename || '';
          if (file.indexOf('chrome-extension://') !== -1 ||
              msg.indexOf('Cannot set property fetch') !== -1 ||
              msg.indexOf('has only a getter') !== -1 ||
              msg.indexOf('inspector.js') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return false;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason || {};
          var msg = reason.message || String(reason);
          var stack = reason.stack || '';
          if (stack.indexOf('chrome-extension://') !== -1 ||
              msg.indexOf('Cannot set property fetch') !== -1 ||
              msg.indexOf('has only a getter') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return false;
          }
        }, true);
      })();
    </script>
    <title>Remix SEO e Sites do PC</title>
    <meta name="description" content="Gerador profissional de prompts estratégicos para sites institucionais, profissionais e landing pages com integração a IA e persistência." />
    <meta property="og:title" content="Remix SEO e Sites do PC" />
    <meta property="og:description" content="Gerador profissional de prompts estratégicos para sites institucionais, profissionais e landing pages com integração a IA e persistência." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

      html, body, #root {
        background-color: #020617 !important;
        color: #f8fafc !important;
        min-height: 100vh;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        margin: 0;
        padding: 0;
      }
    </style>

</html>
