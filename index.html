<!doctype html>
<html lang="pt-BR" class="dark bg-slate-950 text-slate-100" style="background-color: #020617; color: #f8fafc; overflow-x: hidden; width: 100%;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var activeFetch = originalFetch ? originalFetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            }
          });
        } catch (e) {
          // Ignore if descriptor modification is restricted
        }

        // Suppress any external extension errors that try to inject into iframe
        window.addEventListener('error', function(event) {
          if (event.filename && event.filename.includes('chrome-extension://')) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return false;
          }
          if (event.message && (
            event.message.includes('Cannot set property fetch') ||
            event.message.includes('has only a getter')
          )) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return false;
          }
        }, true);
      })();
    </script>
    <title>Remix SEO e Sites do PC</title>
    <meta name="description" content="Gerador profissional de prompts estratégicos para sites institucionais, profissionais e landing pages com integração a IA e persistência." />
    <meta property="og:title" content="Remix SEO e Sites do PC" />
    <meta property="og:description" content="Gerador profissional de prompts estratégicos para sites institucionais, profissionais e landing pages com integração a IA e persistência." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body, #root {
        background-color: #020617 !important;
        color: #f8fafc !important;
        min-height: 100vh;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body class="dark bg-slate-950 text-slate-100 min-h-screen w-full max-w-full overflow-x-hidden antialiased" style="background-color: #020617; color: #f8fafc;">
    <div id="root" class="min-h-screen w-full max-w-full overflow-x-hidden bg-slate-950" style="background-color: #020617;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
